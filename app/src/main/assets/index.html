<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081b19">
<title>ميقات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--accent-rgb:52,211,153;--bg:#081b19;--bg2:#0e2723;--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--text:#f1f7f5;--muted:#93aea8;--accent:#34d399;--gold:#d4af37;--nav:rgba(7,24,21,.94);--shadow:0 12px 32px rgba(0,0,0,.35);--r:20px;--font:'Tajawal','Segoe UI',Tahoma,sans-serif}
[data-theme="light"]{--accent-rgb:15,155,122;--bg:#f1f7f5;--bg2:#e2eeea;--card:#fff;--line:#d8e6e1;--text:#0d2b26;--muted:#56716b;--nav:rgba(255,255,255,.96);--shadow:0 8px 24px rgba(15,60,50,.1);--accent:#0f9b7a}
[data-accent="gold"]{--accent:#d4af37;--accent-rgb:212,175,55}
[data-accent="gold"][data-theme="light"]{--accent:#a97f12;--accent-rgb:169,127,18}
body{font-family:var(--font);color:var(--text);background:linear-gradient(170deg,var(--bg),var(--bg2)) fixed;min-height:100vh;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit}
svg{flex:none}
.app{max-width:460px;margin:0 auto;padding:0 16px 200px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 8px}
.brand{font-size:21px;font-weight:800}
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:14px;font-weight:600}
.loc svg{color:var(--accent)}
.dates{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13.5px;padding:0 4px 14px}
.h2{font-size:14px;color:var(--muted);font-weight:700;margin:22px 6px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.glist{overflow:hidden}
.muted{color:var(--muted);font-size:13.5px}
.fine{color:var(--muted);font-size:14px;text-align:center;line-height:1.75}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:#f3fbf8;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accent-rgb),.38),transparent 55%),radial-gradient(90% 80% at 100% 100%,rgba(212,175,55,.28),transparent 60%),linear-gradient(140deg,#0f463e,#0a2723);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow)}
.hero .pill{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.13)}
.hero .hname{font-size:30px;font-weight:800;margin-top:10px}
.hero .htime{font-size:17px;opacity:.85;direction:ltr;text-align:start}
.cd{font-size:46px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;margin-top:10px}
.hero .rem{font-size:13px;opacity:.8;margin-top:6px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:16px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fde68a);transition:width 1s linear}
.rama{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rama div{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px}
.rama b{display:block;font-size:22px;color:var(--text);direction:ltr;text-align:start;margin-top:2px}
.jm{margin-top:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.jm svg{color:var(--gold)}
.prow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.next{background:linear-gradient(90deg,rgba(var(--accent-rgb),.16),transparent 70%)}
.prow.past .pname,.prow.past .ptime{opacity:.5}
.picon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.13);color:var(--accent)}
.pname{flex:1;font-weight:700;display:flex;align-items:center;gap:8px}
.ptime{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;direction:ltr}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent);color:#04211c;font-weight:800}
.tk{color:var(--accent);min-width:18px;display:inline-flex}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.act svg{color:var(--accent)}
.banner{margin-top:18px;border:1px dashed var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--muted);font-size:13px;background:var(--card)}
.banner small{display:block;font-size:11px;opacity:.7;direction:ltr}
.nav{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:460px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--nav);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px 12px;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:700;padding:4px 0}
.nav .ni{width:52px;height:30px;border-radius:99px;display:grid;place-items:center}
.nav button.on{color:var(--accent)}
.nav button.on .ni{background:rgba(var(--accent-rgb),.16)}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--line);text-align:start}
.row:last-child{border-bottom:0}
button.row:active{background:rgba(127,127,127,.08)}
.ri{width:36px;height:36px;border-radius:11px;background:rgba(var(--accent-rgb),.13);color:var(--accent);display:grid;place-items:center;flex:none}
.rt{flex:1;font-weight:600;min-width:0}
.rt small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.rv{color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.chev{color:var(--muted);display:inline-flex}
[dir="rtl"] .chev{transform:scaleX(-1)}
.check{color:var(--accent);display:inline-flex}
.rowtext{padding:14px 16px;color:var(--muted);font-size:13.5px;line-height:1.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:15px;margin-top:6px}
.seg button{padding:10px 8px;border-radius:11px;font-weight:700;color:var(--muted);font-size:15px}
.seg button.on{background:var(--accent);color:#04211c}
.mseg{display:inline-flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.mseg button{padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.mseg button.on{background:var(--accent);color:#04211c}
.switch{width:52px;height:30px;border-radius:99px;background:#3a5a55;position:relative;flex:none;transition:background .2s}
[data-theme="light"] .switch{background:#c9d8d3}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch.on{background:var(--accent)}
.switch.on::after{left:25px}
.stepper{display:flex;align-items:center;gap:8px;flex:none}
.stepper button{width:32px;height:32px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:18px;font-weight:800;line-height:1}
.stepper span{min-width:60px;text-align:center;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.dialwrap{position:relative;width:min(320px,84vw);aspect-ratio:1}
.dialwrap svg{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid var(--gold);z-index:2}
.face{fill:var(--card);stroke:var(--line);stroke-width:2}
.tick-l{stroke:var(--muted)}
.dl{fill:var(--text);font-size:16px;font-weight:800}
.dl.n{fill:#f87171}
.kaaba rect{fill:#0c0c0c;stroke:var(--gold);stroke-width:2}
.hub{fill:var(--accent)}
.qinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.qinfo div{padding:14px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}
.qinfo b{display:block;color:var(--text);font-size:19px;direction:ltr;font-variant-numeric:tabular-nums}
.sim{width:100%;padding:16px;display:grid;gap:10px}
.sim .h3{font-weight:800}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.dcard{padding:18px 16px 20px;margin-top:14px;text-align:center}
.dtitle{font-size:24px;font-weight:800;line-height:1.6}
.dsub{color:var(--muted);font-size:14px;direction:ltr}
.ring-wrap{position:relative;width:250px;height:250px;margin:16px auto 6px;border-radius:50%;display:grid;place-items:center;cursor:pointer;user-select:none;touch-action:manipulation}
.ring-wrap::before{content:"";position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(var(--accent-rgb),.22),transparent 60%),var(--bg2);border:1px solid var(--line)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .3s ease}
.cwrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.count{font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;line-height:1.1}
.count-sub{color:var(--muted);direction:ltr;font-weight:700}
.hint{color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:700;color:var(--muted)}
.chip2.on{background:var(--accent);color:#04211c;border-color:transparent}
.goals{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;color:var(--muted);font-size:14px;font-weight:700;flex-wrap:wrap}
.pill2{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-weight:800;direction:ltr}
.pill2.on{background:var(--accent);color:#04211c;border-color:transparent}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn-pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--accent);color:#04211c;font-weight:800;width:100%}
.btn-pri:disabled{opacity:.45}
.prog{display:flex;align-items:center;gap:10px;margin:14px 4px 4px;color:var(--muted);font-weight:700;font-size:14px}
.track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);transition:width .3s}
.adh{padding:16px;border-bottom:1px solid var(--line)}
.adh:last-child{border-bottom:0}
.adh-ar{font-size:20px;line-height:1.9;font-weight:700}
.adh-en{color:var(--muted);font-size:14px;margin-top:6px;direction:ltr;text-align:start}
.adh-foot{display:flex;justify-content:flex-end;margin-top:10px}
.adh-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:rgba(var(--accent-rgb),.13);color:var(--accent);font-weight:800;direction:ltr}
.adh.fin .adh-btn{background:var(--accent);color:#04211c}
.adh-btn:disabled{cursor:default}
.navm{display:flex;align-items:center;justify-content:space-between;direction:ltr;margin:10px 2px 14px}
.navm .ttl{font-weight:800;font-size:18px}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text)}
.scroll{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.cal{width:100%;min-width:600px;border-collapse:collapse;font-size:13.5px}
.cal th{padding:12px 6px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);background:rgba(127,127,127,.06)}
.cal td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;direction:ltr}
.cal tr:last-child td{border-bottom:0}
.cal tr.today td{background:rgba(var(--accent-rgb),.16);font-weight:800}
.cal .dd{font-weight:800;display:block}
.cal .sm{display:block;font-size:11px;color:var(--muted);font-weight:600}
.cal tr.fri .dd{color:var(--gold)}
.note{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.7}
.wrap{position:fixed;inset:0;z-index:80}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;max-height:84vh;overflow:auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 16px 26px;border-top:1px solid var(--line);animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 14px}
.sh-title{font-weight:800;font-size:19px;margin:0 4px 12px}
.sheet-p{color:var(--muted);line-height:1.85;font-size:14.5px;padding:0 4px}
.search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--accent)}
.sheet .glist{max-height:58vh;overflow:auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:60}
.modal{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.m-ic{width:56px;height:56px;border-radius:18px;background:rgba(var(--accent-rgb),.14);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px}
.modal h3{text-align:center;font-size:20px;margin-bottom:8px}
.m-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.link{display:block;margin:8px auto 0;color:var(--accent);font-weight:700;font-size:14px}
.ad-creative{height:150px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#db2777 55%,#f59e0b);display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;margin-bottom:14px}
.ad-count{font-size:40px;font-weight:800;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.toasts{position:fixed;left:0;right:0;bottom:104px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.toast{background:#0d2d28;color:#e9fbf3;border:1px solid rgba(255,255,255,.1);padding:11px 18px;border-radius:14px;box-shadow:var(--shadow);font-size:14.5px;max-width:420px;text-align:center;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qhead{align-items:flex-start;gap:10px;padding-top:16px}
.qh-t{flex:1;min-width:0}
.qh-t .brand{font-size:19px;line-height:1.4}
.qh-t .muted{font-size:12.5px;line-height:1.6;margin-top:2px}
.qplay-all{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;font-size:13px;white-space:nowrap;flex:none}
.qplayer{position:sticky;top:8px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:12px 0 4px;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.qp-info{flex:1;min-width:0}
.qp-t{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qp-s{color:var(--muted);font-size:12.5px;margin-top:2px}
.qp-ctl{display:flex;align-items:center;gap:8px;flex:none}
.qp-b{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.qp-play{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--accent);color:#04211c}
.qrow .qnum{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.13);color:var(--accent);font-weight:800;font-size:14px;flex:none;direction:ltr}
.qcont{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-top:12px;text-align:start;cursor:pointer}
.qcont .rt{flex:1;font-weight:700}
.qcont .rt small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;margin-top:2px}
.qdaily{display:block;width:100%;padding:18px 18px 16px;margin-top:12px;text-align:start;cursor:pointer;background:radial-gradient(120% 100% at 0% 0%,rgba(212,175,55,.16),transparent 60%),var(--card)}
.qd-h{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:8px}
.qd-ar{font-size:22px;line-height:2}
.qd-f{font-size:13px;color:var(--muted);margin-top:10px}
.v-ar{font-family:'Amiri','Traditional Arabic',serif;line-height:2.25;text-align:justify;direction:rtl}
.v-en{color:var(--muted);font-size:14.5px;line-height:1.75;margin-top:8px;direction:ltr;text-align:start;font-family:Georgia,'Times New Roman',serif}
.vlist{overflow:hidden}
.verse{padding:16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.verse:last-child{border-bottom:0}
.verse:active{background:rgba(127,127,127,.06)}
.verse.on{background:linear-gradient(90deg,rgba(var(--accent-rgb),.16),transparent 75%)}
.v-top{display:flex;align-items:center;margin-bottom:6px}
.v-num{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--accent);direction:ltr}
.verse.on .v-num{background:var(--accent);color:#04211c;border-color:transparent}
.basmala{text-align:center;font-family:'Amiri',serif;font-size:26px;color:var(--gold);padding:20px 12px 8px}
.page{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.v-top{justify-content:space-between}
.v-dl{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.v-dl.done{color:var(--accent);border-color:transparent;background:rgba(var(--accent-rgb),.13)}
.dl-actions{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin:12px 0 14px}
.dl-actions button{padding:11px 14px;justify-content:center}
.dlt{height:6px;margin:0 2px 4px}
.chk-box{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:#04211c}
.chk-box.on{background:var(--accent);border-color:transparent}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
/* ===== Math helpers ===== */
const D2R=Math.PI/180,R2D=180/Math.PI;

function deepMerge(a,b){
  for(const k in b){
    const bv=b[k];
    if(bv&&typeof bv==='object'&&!Array.isArray(bv)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deepMerge(a[k],bv);
    else a[k]=bv;
  }
  return a;
}
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved) return deepMerge(structuredClone(DEFAULT),saved);
  }catch(e){}
  return structuredClone(DEFAULT);
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
let S=load();

/* ===== Helpers ===== */
const LOC=()=>S.lang==='ar'?'ar-u-nu-latn':'en-US';
const t=k=>T[S.lang]?.[k]??T.en[k]??k;
const locName=()=>S.loc[S.lang]||S.loc.en;
const fmtTime=d=>new Intl.DateTimeFormat(LOC(),{hour:'2-digit',minute:'2-digit',hourCycle:S.hour12?'h12':'h23',timeZone:S.loc.tz}).format(d);
const fmtNum=n=>n.toLocaleString(LOC());
const gregLong=d=>new Intl.DateTimeFormat(LOC(),{weekday:'long',day:'numeric',month:'long',timeZone:S.loc.tz}).format(d);
const adjDate=d=>new Date(d.getTime()+S.hijriOffset*864e5);
function hijriLong(d){
  try{
    return new Intl.DateTimeFormat(S.lang==='ar'?'ar-u-ca-islamic-umalqura-nu-latn':'en-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric',timeZone:S.loc.tz}).format(adjDate(d));
  }catch(e){ return ''; }
}
function hijriParts(d){
  const p={};
  try{
    new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric',timeZone:S.loc.tz}).formatToParts(d).forEach(x=>p[x.type]=x.value);
  }catch(e){}
  return {y:+p.year,m:+p.month,d:+p.day};
}
function ymd(d,tz){
  const p={};
  new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric',weekday:'short'}).formatToParts(d).forEach(x=>p[x.type]=x.value);
  return {y:+p.year,m:+p.month,d:+p.day,wd:p.weekday};
}
const dayKey=o=>`${o.y}-${o.m}-${o.d}`;
function hms(ms){
  ms=Math.max(0,ms);
  const s=Math.floor(ms/1000);
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
const signed=n=>n>0?`+${n}`:`${n}`;
/* ===== Astronomy: sun position and prayer times ===== */
let TODAY=null;
let AC=null;
function sunPos(jd){
  const D=jd-2451545;
  const g=fixA(357.529+0.98560028*D,360);
  const q=fixA(280.459+0.98564736*D,360);
  const L=fixA(q+1.915*sinD(g)+0.02*sinD(2*g),360);
  const e=23.439-0.00000036*D;
  const RA=Math.atan2(cosD(e)*sinD(L),cosD(L))*R2D/15;
  const eqt=q/15-fixA(RA,24);
  const decl=asinD(sinD(e)*sinD(L));
  return {decl,eqt};
}
function methodCfg(){
  if(S.method==='custom') return {fajr:S.custom.fajr,isha:S.custom.isha};
  return METHODS[S.method]||METHODS.mwl;
}
/* Columns shown for the day: Asr appears once per selected school ('asr' = majority, 'asrh' = Hanafi). */
function colKeys(){
  const sel=S.asrSel&&S.asrSel.length?S.asrSel:['standard'];
  return PRAYERS.flatMap(k=>k!=='asr'?[k]:[...(sel.includes('standard')?['asr']:[]),...(sel.includes('hanafi')?['asrh']:[])]);
}
function prayersFor(day){
  const {y,m,d}=day, lat=S.loc.lat, lng=S.loc.lng, cfg=methodCfg();
  const baseMs=Date.UTC(y,m-1,d), jd0=baseMs/864e5+2440587.5;
  let noon=12-lng/15, sp=sunPos(jd0+noon/24);
  for(let i=0;i<3;i++){ noon=12-sp.eqt-lng/15; sp=sunPos(jd0+noon/24); }
  const decl=sp.decl;
  const xOf=a=>(sinD(a)-sinD(lat)*sinD(decl))/(cosD(lat)*cosD(decl));
  const H=a=>{ const x=xOf(a); return (x>1||x<-1)?NaN:acosD(x)/15; };
  const h0=xOf(-0.833);
  const dayLen=h0>1?0:h0<-1?24:2*acosD(h0)/15;
  const night=24-dayLen;
  const asrAt=F=>{ const v=noon+H(arccotD(F+Math.abs(tanD(lat-decl)))); return isNaN(v)?noon+dayLen/4:v; };
  const sunrise=noon-dayLen/2, sunset=noon+dayLen/2;
  let fajr=noon-H(-cfg.fajr);
  let isha=cfg.ishaMin!=null?sunset+cfg.ishaMin/60:noon+H(-cfg.isha);
  const portion=a=>S.highLat==='middle'?0.5:S.highLat==='seventh'?1/7:a/60;
  if(isNaN(fajr)) fajr=sunrise-portion(cfg.fajr)*night;
  if(isNaN(isha)) isha=sunset+portion(cfg.isha??17)*night;
  const times={fajr,sunrise,dhuhr:noon,asr:asrAt(1),asrh:asrAt(2),maghrib:sunset,isha};
  return colKeys().map(k=>({
    key:k,
    date:new Date(Math.round((baseMs+(times[k]+(S.offsets[k==='asrh'?'asr':k]||0)/60)*36e5)/6e4)*6e4)
  }));
}
function recalc(){
  const now=new Date(), nowMs=now.getTime(), tz=S.loc.tz;
  const today=ymd(now,tz);
  const list=prayersFor(today);
  const seq=[
    ...prayersFor(ymd(new Date(nowMs-864e5),tz)).filter(p=>p.key==='isha'),
    ...list.filter(p=>p.key!=='sunrise'),
    ...prayersFor(ymd(new Date(nowMs+864e5),tz)).filter(p=>p.key==='fajr')
  ].sort((a,b)=>a.date-b.date);
  const prev=[...seq].reverse().find(p=>p.date.getTime()<=nowMs)||seq[0];
  const next=seq.find(p=>p.date.getTime()>nowMs)||seq[seq.length-1];
  const fajr=list.find(p=>p.key==='fajr');
  TODAY={
    today,list,prev,next,
    ramadan:hijriParts(adjDate(now)).m===9,
    imsak:new Date(fajr.date.getTime()-6e5)
  };
}
function progressPct(now){
  const a=TODAY.prev.date.getTime(), b=TODAY.next.date.getTime();
  return clamp((now-a)/(b-a)*100,0,100);
}

/* ===== Qibla geometry ===== */
function qiblaDeg(){
  const p1=S.loc.lat*D2R, p2=KAABA.lat*D2R, dl=(KAABA.lng-S.loc.lng)*D2R;
  const y=Math.sin(dl), x=Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl);
  return (Math.atan2(y,x)*R2D+360)%360;
}
function distKm(){
  const p1=S.loc.lat*D2R, p2=KAABA.lat*D2R, dp=p2-p1, dl=(KAABA.lng-S.loc.lng)*D2R;
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*6371*Math.asin(Math.sqrt(a));
}

/* ===== Sound, ticking and alerts ===== */
function beep(freq=1000,dur=0.05,vol=0.12){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(AC.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.stop(AC.currentTime+dur+0.01);
  }catch(e){}
}
const tickSound=()=>beep(1400,0.035,0.08);
function chime(){ beep(660,1.6,0.18); setTimeout(()=>beep(880,1.2,0.12),500); }

function checkAlerts(){
  if(!TODAY||!S.notify) return;
  const now=Date.now(), pre=S.preMin*6e4, dk=dayKey(TODAY.today);
  TODAY.list.filter(p=>p.key!=='sunrise').forEach(p=>{
    const at=p.date.getTime(), key=`${dk}|${p.key}`;
    if(now>=at-pre && now<at+9e4 && !S.fired.includes(key)) fireAlert(key,`${t('adhanNow')} ${t(p.key)}`,fmtTime(p.date));
  });
  if(S.suhoor && TODAY.ramadan){
    const at=TODAY.imsak.getTime(), key=`${dk}|imsak`;
    if(now>=at-pre && now<at+9e4 && !S.fired.includes(key)) fireAlert(key,t('imsakNow'),fmtTime(TODAY.imsak));
  }
  if(S.fired.length>80) S.fired=S.fired.slice(-50);
}
function fireAlert(key,title,body){
  S.fired.push(key); save();
  try{ if('Notification' in window && Notification.permission==='granted') new Notification(title,{body,tag:key}); }catch(e){}
  toast(`${title} · ${body}`);
  chime();
}
function tick(){
  if(!TODAY) return;
  const now=Date.now();
  if(now>=TODAY.next.date.getTime() || dayKey(ymd(new Date(now),S.loc.tz))!==dayKey(TODAY.today)){
    recalc(); render(); return;
  }
  const cd=$('#cd'); if(cd) cd.textContent=hms(TODAY.next.date.getTime()-now);
  const bar=$('#bar'); if(bar) bar.style.width=progressPct(now)+'%';
}

/* ===== Qibla compass ===== */
let gotOrient=false, heading=0, simHeading=0, orientOn=false;
const curHeading=()=>gotOrient?heading:simHeading;
const needsPerm=()=>typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number'&&!isNaN(e.webkitCompassHeading)) h=e.webkitCompassHeading;
  else if(e.alpha!=null) h=(360-e.alpha)%360;
  if(h==null) return;
  heading=h; gotOrient=true;
  if(S.tab==='qibla') updateCompassEl();
}
function startOrient(){
  if(orientOn) return;
  orientOn=true;
  const ev=('ondeviceorientationabsolute' in window)?'deviceorientationabsolute':'deviceorientation';
  window.addEventListener(ev,onOrient,true);
}
async function enableCompass(){
  try{
    if(needsPerm()){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){ toast(t('noSensor')); return; }
    }
    startOrient();
  }catch(e){ toast(t('noSensor')); }
  render();
}
function dialSVG(){
  const q=qiblaDeg(), h=curHeading();
  let ticks='';
  for(let a=0;a<360;a+=5){
    const major=a%30===0;
    ticks+=`<line class="tick-l" x1="150" y1="${major?14:20}" x2="150" y2="${major?30:25}" stroke-width="${major?2.5:1.2}" transform="rotate(${a} 150 150)"/>`;
  }
  const pos=(deg,r)=>{ const rad=deg*D2R; return [150+r*Math.sin(rad),150-r*Math.cos(rad)]; };
  let labels='';
  [['N',0],['E',90],['S',180],['W',270]].forEach(([l,a])=>{
    const [x,y]=pos(a,96);
    labels+=`<text class="dl${l==='N'?' n':''}" x="${x}" y="${y+6}" text-anchor="middle">${l}</text>`;
  });
  const [kx,ky]=pos(q,112);
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Qibla compass">
    <circle class="face" cx="150" cy="150" r="142"/>
    <g id="dialg" transform="rotate(${-h} 150 150)">
      ${ticks}${labels}
      <g class="kaaba" transform="translate(${kx} ${ky})"><rect x="-12" y="-12" width="24" height="24" rx="5"/></g>
    </g>
    <circle class="hub" cx="150" cy="150" r="5"/>
  </svg>`;
}
function updateCompassEl(){
  const h=curHeading(), q=qiblaDeg();
  const g=$('#dialg'); if(g) g.setAttribute('transform',`rotate(${-h} 150 150)`);
  const hd=$('#qhead'); if(hd) hd.textContent=Math.round(h)+'°';
  const diff=((q-h+540)%360)-180;
  const el=$('#qdiff');
  if(el) el.textContent=Math.abs(diff)<3?t('aligned'):`${t('offBy')} ${Math.round(Math.abs(diff))}°`;
}
function screenQibla(){
  const q=qiblaDeg(), d=distKm();
  const sim=gotOrient?'':`<div class="card sim">
    <div class="h3">${t('simulate')}</div>
    <input id="simH" type="range" min="0" max="359" step="1" value="${Math.round(simHeading)}">
    <p class="muted">${t('noSensor')}</p>
    ${needsPerm()?`<button class="btn-pri" data-act="compass">${ic('compass',18)}${t('enableCompass')}</button>`:''}
  </div>`;
  return `${header(t('qibla'))}
  <section class="qwrap">
    <p class="muted">${t('rotate')}</p>
    <div class="dialwrap"><div class="pointer"></div>${dialSVG()}</div>
    <div class="muted" id="qdiff"></div>
    <div class="qinfo">
      <div>${t('qiblaDir')}<b>${Math.round(q)}°</b></div>
      <div>${t('distance')}<b>${fmtNum(Math.round(d))} ${t('kmUnit')}</b></div>
      <div>${t('heading')}<b id="qhead">${Math.round(curHeading())}°</b></div>
    </div>
    ${sim}
  </section>`;
}

function screenCalendar(){
  const c=S.cal||{y:TODAY.today.y,m:TODAY.today.m};
  const title=new Intl.DateTimeFormat(LOC(),{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(c.y,c.m-1,15)));
  const days=new Date(Date.UTC(c.y,c.m,0)).getUTCDate();
  let rows='';
  for(let d=1; d<=days; d++){
    const pr=prayersFor({y:c.y,m:c.m,d});
    const dt=new Date(Date.UTC(c.y,c.m-1,d,12));
    const wd=new Intl.DateTimeFormat(LOC(),{weekday:'short',timeZone:'UTC'}).format(dt);
    const isT=TODAY.today.y===c.y&&TODAY.today.m===c.m&&TODAY.today.d===d;

  return {c,tg,pct};
}
function updateRingEl(){

const NATIVE=typeof window.Android!=='undefined';
Object.assign(T.ar,{inMinutes:'بعد',notifPerm:'صلاحية الإشعارات',granted:'مفعّلة',askPerm:'السماح',bubbleOn:'فقاعة الأذكار عند فتح القفل',overlayNeed:'فعّل «الظهور فوق التطبيقات» لميقات ثم أعد المحاولة',nativeOnly:'هذه الميزة متاحة في تطبيق أندرويد فقط'});

const nat=(fn,...a)=>{ try{ return NATIVE&&typeof Android[fn]==='function'?Android[fn](...a):undefined; }catch(e){ return undefined; } };
let lastSync='';
window.__onPerm=()=>{ lastSync=''; render(); };
function syncNative(){
  if(!NATIVE||!TODAY) return;
  const now=Date.now(), items=[], pre=S.preMin;
  if(S.notify){
    for(let d=0; d<3; d++){
      const day=ymd(new Date(now+d*864e5),S.loc.tz);
      prayersFor(day).filter(p=>p.key!=='sunrise').forEach(p=>{
        const at=p.date.getTime(), name=t(p.key), tm=fmtTime(p.date);
        if(at<=now) return;
        if(pre>0) items.push({id:Math.floor(at/6e4)*2+1,t:at-pre*6e4,title:`${name} ${t('inMinutes')} ${pre} ${t('minutes')}`,body:tm});
        items.push({id:Math.floor(at/6e4)*2,t:at,title:`${t('adhanNow')} ${name}`,body:tm});
      });
    }
    if(S.suhoor&&TODAY.ramadan&&TODAY.imsak.getTime()>now) items.push({id:900000001,t:TODAY.imsak.getTime(),title:t('imsakNow'),body:fmtTime(TODAY.imsak)});
  }
  const payload=JSON.stringify({enabled:S.notify,items});
  if(payload===lastSync) return;
  lastSync=payload;
  nat('schedulePrayers',payload);
}
async function toggleNotify(){
  if(!S.notify){
    if(NATIVE){
      nat('requestNotifications');
    }else if('Notification' in window){
      if(Notification.permission==='default'){
        try{ const r=await Notification.requestPermission(); if(r!=='granted') toast(t('permDenied')); }catch(e){}
      }else if(Notification.permission==='denied') toast(t('permDenied'));
    }
    S.notify=true;
    toast(t('notifOn'));
  }else{
    S.notify=false;
    toast(t('notifOff'));
  }
  save();
  render();
}
function toggleBubble(){
  if(!NATIVE){ toast(t('nativeOnly')); return; }
  const want=!S.bubble;
  const r=nat('setBubble',want);
  if(want&&r!=='ok') toast(t('overlayNeed'));
  else S.bubble=want;

}

let IDBP=null;
function idb(){
  if(!IDBP) IDBP=new Promise((res,rej)=>{
    const r=indexedDB.open('quran-store',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return IDBP;
}
async function kvGet(k){
  try{
    const db=await idb();
    return await new Promise((res,rej)=>{
      const q=db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess=()=>res(q.result||null);
      q.onerror=()=>rej(q.error);
    });
  }catch(e){ return null; }
}
async function kvSet(k,v){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(v,k);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
async function loadText(n){
  let tx=QX.text.get(n);
  if(tx) return tx;
  tx=await kvGet('t'+n);
  if(!tx){
    const d=await qget(`/surah/${n}/editions/quran-uthmani,en.pickthall`);
    const ar=d.find(e=>e.edition.identifier==='quran-uthmani');
    const en=d.find(e=>e.edition.identifier==='en.pickthall');
    tx={ar:ar.ayahs,en:en?en.ayahs:[]};
    kvSet('t'+n,tx);
  }
  QX.text.set(n,tx);
  return tx;
}
async function loadAudio(n,reciter){

}

const RECALC=new Set(['city','method','asr','highlat','hijri','off','ang']);
function act(a){
  const [cmd,x,y]=a.split(':');
  switch(cmd){
    case 'noop': return;
    case 'tab': S.tab=x; save(); render(); window.scrollTo(0,0); return;
    case 'open': return openSheetFor(x);
    case 'closeSheet': closeSheet(); return;
    case 'close': closeSheet(); closeModal(); return;
    case 'city': S.loc={...CITIES[+x]}; closeSheet(); afterLoc(); return;
    case 'gps': return detectGPS();
    case 'method': S.method=x; closeSheet(); break;
    case 'asrt': return toggleAsr(x);
    case 'qbg': S.quran.bg=!S.quran.bg; nat('setBgPlay',S.quran.bg); break;
    case 'highlat': S.highLat=x; closeSheet(); break;
    case 'hijri': S.hijriOffset=+x; closeSheet(); break;
    case 'pre': S.preMin=+x; closeSheet(); break;
    case 'off': S.offsets[x]=clamp((S.offsets[x]||0)+ +y,-60,60); break;
    case 'ang': S.custom[x]=clamp(Math.round((S.custom[x]+ +y)*10)/10,10,25); break;
    case 'lang': S.lang=x; break;
    case 'theme': S.theme=x; break;
    case 'hour': S.hour12=x==='12'; break;
    case 'accent':
      if(x==='gold'&&!S.unlockedGold) return watchAd();
      S.accent=x; break;
    case 'notify': return toggleNotify();
    case 'notifreq': nat('requestNotifications'); return;
    case 'bubble': return toggleBubble();
    case 'suhoor': S.suhoor=!S.suhoor; break;
    case 'consentReopen': return openConsent();
    case 'consent': S.consent=x==='yes'?'personalized':'non-personalized'; closeModal(); break;
    case 'watch': return watchAd();
    case 'claimAd': S.unlockedGold=true; S.accent='gold'; closeModal(); toast(t('unlocked')); break;
    case 'privacy': return openPrivacy();
    case 'share': return shareToday();
    case 'compass': return enableCompass();
    case 'dsub': S.dhikrSub=x; break;
    case 'dhikr': S.tas.dhikr=+x; break;
    case 'goal': S.tas.target=+x; break;
    case 'tap': return tapDhikr();
    case 'treset': S.tas.counts[S.tas.dhikr]=0; break;
    case 'tsound': S.tas.sound=!S.tas.sound; break;
    case 'alist': S.adhList=x; break;
    case 'aadd': return addAdhkar(x,+y);
    case 'calm': calMonth(+x); break;
    case 'qopen':
      if(!S.quran.last||S.quran.last.s!==+x) S.quran.last={s:+x,a:1};
      QX.open=+x; QX.q=''; window.scrollTo(0,0); break;
    case 'qback': QX.open=null; window.scrollTo(0,0); break;
    case 'qplay': return qPlayAyah(+x,+y);
    case 'qplaysurah': return qPlayAyah(+x,0);
    case 'qtoggle': return qToggle();
    case 'qnext': return qStep(1);
    case 'qprev': return qStep(-1);
    case 'qreciter': return openQReciter();
    case 'qrec': S.quran.reciter=x; closeSheet(); break;
    case 'qdownload': return downloadQuran();
    case 'qdl': return dlSingle(+x,+y);
    case 'qdlsurah': return dlStart([+x]);
    case 'dlopen': return openDownloads();
    case 'dlsel': QX.sel.has(+x)?QX.sel.delete(+x):QX.sel.add(+x); return paintDl();
    case 'dlall': if(QX.sel.size===QX.index.length) QX.sel.clear(); else QX.index.forEach(s=>QX.sel.add(s.n)); return paintDl();
    case 'dlgo': return dlStart([...QX.sel].sort((a,b)=>a-b));
    case 'dlrm': return deleteDownloads();
    case 'qen': S.quran.en=!S.quran.en; break;
    case 'qfont': S.quran.font=clamp(S.quran.font+ +x,18,40); break;
    default: return;
  }
  if(RECALC.has(cmd)) recalc();
  save();
  render();
}

Object.assign(T.ar,{qAudioMgr:'تلاوات بدون إنترنت',qDlTitle:'تحميل التلاوات',qDlAll:'تحديد الكل',qDlGo:'تحميل المحدد',qDlDelete:'حذف',qDlNote:'تُحفظ التلاوات على جهازك للاستماع بدون إنترنت، وكل سورة تقارب عدة ميغابايت. التلاوات ملك لأصحابها ويُشترط الإسناد إليهم.',qDlPrep:'جارٍ تجهيز الملفات…',qDlProg:'تم تحميل',qDlFailed:'فشل',qDlHave:'محمّلة',qDlDone:'اكتمل التحميل ✓',qDlPartial:'اكتمل التحميل مع بعض الأخطاء',qDlNothing:'كل ما اخترته محمّل بالفعل',qDlFail:'تعذّر بدء التحميل',qDlBusy:'يوجد تحميل قيد التنفيذ',qDlStarted:'بدأ تحميل الآية',qDlAyah:'تحميل الآية',qDlSurah:'تحميل السورة',qDlDeleted:'تم حذف التلاوات المحمّلة'});
Object.assign(T.en,{qAudioMgr:'Offline recitations',qDlTitle:'Download recitations',qDlAll:'Select all',qDlGo:'Download selected',qDlDelete:'Delete',qDlNote:'Recitations are saved on your device for offline listening. Each surah is several megabytes. Recitations belong to their reciters, and attribution applies.',qDlPrep:'Preparing files…',qDlProg:'Downloaded',qDlFailed:'Failed',qDlHave:'Saved',qDlDone:'Download complete ✓',qDlPartial:'Download finished with some errors',qDlNothing:'Everything selected is already saved',qDlFail:'Could not start the download',qDlBusy:'A download is already running',qDlStarted:'Ayah download started',qDlAyah:'Download ayah',qDlSurah:'Download surah',qDlDeleted:'Downloaded recitations deleted'});
function surahOffset(n){ let s=0; for(let k=0;k<n-1;k++) s+=QX.index[k].count; return s; }
const gOf=(n,i)=>surahOffset(n)+i+1;
function refreshDl(){
  const raw=NATIVE?(nat('downloadedIds',S.quran.reciter)||''):'';
  QX.dlSet=new Set(raw?raw.split(',').map(Number):[]);
}
function isDl(n,i){ return !!(QX.index&&QX.dlSet.has(gOf(n,i))); }
function ayahSrc(n,i,remote){
  if(isDl(n,i)) return AUDIO_HOST+S.quran.reciter+'/'+gOf(n,i)+'.mp3';
  return remote;
}
function surahDlCount(n){
  const o=surahOffset(n), k=QX.index[n-1].count; let c=0;
  for(let i=1;i<=k;i++) if(QX.dlSet.has(o+i)) c++;
  return c;
}
async function audioListFor(n){
  const key=n+'|'+S.quran.reciter;
  return QX.audio.get(key)||loadAudio(n,S.quran.reciter);
}
async function dlStart(surahs){
  if(!NATIVE){ toast(t('nativeOnly')); return; }
  if(QX.dlp){ toast(t('qDlBusy')); return; }
  QX.dlp={done:0,total:0,failed:0,prep:true}; paintDl();
  const items=[]; let failed=0;
  for(const n of surahs){
    const urls=await audioListFor(n);
    if(!urls){ failed++; continue; }
    const o=surahOffset(n);
    urls.forEach((u,i)=>{ if(u&&!QX.dlSet.has(o+i+1)) items.push({g:o+i+1,url:u}); });
  }
  if(!items.length){
    QX.dlp=null; paintDl();
    toast(failed===surahs.length?t('qOffline'):t('qDlNothing'));
    return;
  }
  QX.dlp={done:0,total:items.length,failed:0};
  paintDl();
  const ok=nat('downloadAyahs',S.quran.reciter,JSON.stringify(items));
  if(!ok){ QX.dlp=null; paintDl(); toast(t('qDlFail')); }
}
async function dlSingle(n,i){
  if(!NATIVE){ toast(t('nativeOnly')); return; }
  if(QX.dlp){ toast(t('qDlBusy')); return; }
  if(isDl(n,i)){ toast(t('qDlHave')); return; }
  const urls=await audioListFor(n);
  const u=urls&&urls[i];
  if(!u){ toast(t('qNeedNet')); return; }
  QX.dlp={done:0,total:1,failed:0};
  const ok=nat('downloadAyahs',S.quran.reciter,JSON.stringify([{g:gOf(n,i),url:u}]));
  if(!ok){ QX.dlp=null; toast(t('qDlFail')); return; }
  toast(t('qDlStarted'));
  render();
}
function deleteDownloads(){
  if(!NATIVE) return;
  if(QX.dlp){ toast(t('qDlBusy')); return; }
  nat('deleteAudio',S.quran.reciter);
  refreshDl(); toast(t('qDlDeleted')); paintDl(); render();
}
/* Called by the native downloader: done, total, failed, finished */
window.__dl=(done,total,failed,fin)=>{
  if(fin){
    QX.dlp=null;
    refreshDl();
    toast(failed?t('qDlPartial'):t('qDlDone'));
    render();
  }else{
    QX.dlp={done,total,failed};
  }
  paintDl();
};
function openDownloads(){
  if(!NATIVE){ toast(t('nativeOnly')); return; }
  refreshDl();
  openSheet(`<div class="sh-title">${t('qDlTitle')}</div>
    <div class="muted" id="dlprog"></div>
    <div class="track dlt"><span id="dlbar"></span></div>
    <div class="dl-actions">
      <button class="btn-ghost" data-act="dlall">${t('qDlAll')}</button>
      <button class="btn-pri" data-act="dlgo" id="dlgo">${t('qDlGo')}</button>
      <button class="btn-ghost" data-act="dlrm" aria-label="${t('qDlDelete')}">${ic('trash',18)}</button>
    </div>
    <div class="card glist" id="dlbody"></div>
    <p class="note">${t('qDlNote')}</p>`);
  paintDl();
}
function paintDl(){
  const body=$('#dlbody'); if(!body||!QX.index) return;
  const p=QX.dlp, pct=p&&p.total?Math.round(p.done/p.total*100):0;
  const prog=$('#dlprog');
  if(prog) prog.textContent=p?(p.prep?t('qDlPrep'):`${t('qDlProg')} ${fmtNum(p.done)} / ${fmtNum(p.total)}${p.failed?` · ${t('qDlFailed')} ${fmtNum(p.failed)}`:''}`):'';
  const bar=$('#dlbar'); if(bar) bar.style.width=pct+'%';
  const go=$('#dlgo');
  if(go){ go.disabled=!!p||!QX.sel.size; go.textContent=`${t('qDlGo')}${QX.sel.size?` (${fmtNum(QX.sel.size)})`:''}`; }
  body.innerHTML=QX.index.map(x=>{
    const have=surahDlCount(x.n), full=have>=x.count, on=QX.sel.has(x.n);
    return `<button class="row" data-act="dlsel:${x.n}">
      <span class="chk-box${on?' on':''}">${on?ic('check',14):''}</span>
      <span class="rt">${S.lang==='ar'?x.ar:x.en}<small>${fmtNum(x.n)} · ${fmtNum(x.count)} ${t('qVerses')}</small></span>
      <span class="rv">${full?t('qDlHave'):have?`${fmtNum(have)} / ${fmtNum(x.count)}`:''}</span>
    </button>`;
  }).join('');
}

/* ===== Global listeners ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  act(el.dataset.act);
});
document.addEventListener('input',e=>{
  if(e.target.id==='csearch') renderCityList(e.target.value);
  if(e.target.id==='qsearch'){ QX.q=e.target.value; const l=$('#qlist'); if(l&&QX.index) l.innerHTML=surahRows(); }
  if(e.target.id==='simH'){ simHeading=+e.target.value; updateCompassEl(); }
});

/* ===== Boot ===== */
refreshDl();
nat('setBgPlay',!!S.quran.bg);
recalc();
render();
if(!needsPerm()) startOrient();
setInterval(tick,1000);
setInterval(checkAlerts,15000);
if(S.consent===null) setTimeout(openConsent,900);
